      <path d="M260 155 L292 173 V203 H260 Z" />
      <path d="M220 211 H252 V243 H220 Z" />
      <path d="M260 211 H292 V243 H260 Z" />
    </g>
    <path d="M142 233 C111 257 99 285 116 301 C144 329 243 322 321 300 C367 287 401 267 404 248 C416 267 399 288 375 305 C317 346 202 357 132 335 C70 316 68 271 142 233 Z" fill="url(#himmo-ribbon-gradient)" />
    <path d="M335 101 H369 V143 L335 119 Z" fill="var(--himmo-logo-accent, #0878FF)" />
