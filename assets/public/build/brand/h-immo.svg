<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <title>H-IMMO — Symbole architectural</title>
  <defs>
    <linearGradient id="himmo-roof-gradient" x1="100" y1="150" x2="410" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="var(--himmo-logo-roof-start, #FFFFFF)" />
      <stop offset="0.48" stop-color="var(--himmo-logo-roof-mid, #EAF5FF)" />
      <stop offset="1" stop-color="var(--himmo-logo-accent, #0878FF)" />
    </linearGradient>
    <linearGradient id="himmo-structure-gradient" x1="150" y1="180" x2="370" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="var(--himmo-logo-structure-start, #FFFFFF)" />
      <stop offset="1" stop-color="var(--himmo-logo-structure-end, #DCEAFF)" />
    </linearGradient>
    <linearGradient id="himmo-window-gradient" x1="210" y1="180" x2="300" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="var(--himmo-logo-accent-bright, #63E2FF)" />
      <stop offset="1" stop-color="var(--himmo-logo-accent, #0066FF)" />
    </linearGradient>
    <linearGradient id="himmo-ribbon-gradient" x1="90" y1="290" x2="420" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="var(--himmo-logo-accent-bright, #27D9F5)" />
      <stop offset="0.55" stop-color="var(--himmo-logo-accent, #079DFF)" />
      <stop offset="1" stop-color="var(--himmo-logo-accent-dark, #0755ED)" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#102326" />
