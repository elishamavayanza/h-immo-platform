# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    uploads_dir: '%kernel.project_dir%/public/uploads'
    uploads_base_url: '/uploads'
    # URL du front React : cible des liens d'activation et de
    # réinitialisation de mot de passe envoyés par email. Le second argument
    # de `ParameterBagInterface::get()` étant ignoré par PHP sur une
    # méthode d'interface, un paramètre non déclaré lève une exception :
    # ces deux valeurs doivent donc exister dans le conteneur. Elles sont
    # surchargeables dans `.env.local`, et un défaut est fourni dans `.env`.
    app.frontend_url: '%env(APP_FRONTEND_URL)%'
    mailer.from: '%env(MAILER_FROM_ADDRESS)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

# makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude: '../src/Dto/Response/Report/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Le provider doit recevoir la classe d'entité et la propriété
    # d'identification, sinon Symfony ne peut pas le construire.
    App\Security\AppUserProvider:
        arguments:
            $classOrAlias: App\Entity\Identity\User
            $property: email

    App\Service\System\FileUploadService:
        arguments:
            $uploadsDir: '%uploads_dir%'
            $baseUrl: '%uploads_base_url%'

    # La clé de signature et la durée de vie des jetons d'API.
    # Le constructeur de `TokenManager` refuse de démarrer si la clé est
    # absente ou trop courte : cela vaudrait des jetons forables.
    App\Service\Identity\TokenManager:
        arguments:
            $jwtSecret: '%env(JWT_SECRET)%'
            $jwtTtl: '%env(int:JWT_TTL)%'
