security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # Les comptes vivent en base : aucun provider en mémoire ne peut
        # faire autorité, sinon `SecurityService::getCurrentUser()`
        # ne verrait jamais un `App\Entity\Identity\User` réel.
        app_user_provider:
            entity:
                class: App\Entity\Identity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            provider: app_user_provider
            lazy: true
            # `user_checker` reste configuré pour les authentificateurs qui
            # le sollicitent. `json_login` ne le fait pas : c'est
            # `AppUserProvider` qui refuse les comptes désactivés.
            user_checker: App\Security\AccountStateUserChecker
            # Limitation des tentatives : sans elle, le login accepte des
            # milliers d'essais de mot de passe par seconde.
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

            # Authentification JSON : le client envoie
            # { "email": "...", "password": "..." } sur /api/auth/login.
            # L'authentificateur est celui fourni par Symfony
            # (symfony/security-bundle >= 6.2), sans dépendance additionnelle.
            json_login:
                check_path: api_login
                username_path: email
                password_path: password
                # Gestionnaire d'échec explicite : le message reste générique
                # afin de ne pas distinguer « e-mail inconnu » de « mot de
                # passe faux », ce qui permettrait d'énumérer les comptes, et
                # un blocage temporaire renvoie 429 plutôt que 401.
                failure_handler: App\Security\JsonAuthenticationFailureHandler

            logout:
                path: api_logout
                # Invalide réellement la session : sans cela, un jeton
                # précédent resterait accepté après « déconnexion ».
                invalidate_session: true

        # Générateur de jetons nocturne : routes AJAX uniquement. Sans
        # pare-feu dédié, ces routes exigeraient une authentification.
        token_generator:
            security: false

    # Note: Only the *first* matching rule is applied
    access_control:
        # Public : on ne peut pas exiger un jeton pour obtenir un jeton.
        - { path: ^/api/auth/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }

        # Public : l'onboarding d'un compte (Organization + PATRON) se fait
        # par email. Sans ces deux exceptions, les endpoints tomberaient
        # sur la règle `^/api` ci-dessous et exigeraient une session déjà
        # ouverte, ce qui rendrait le mot de passe oublié impossible à
        # utiliser. `PasswordResetService` répond par ailleurs 200 et un
        # message identique que l'email existe ou non : ces routes ne
        # révèlent rien sur l'existence d'un compte.
        - { path: ^/api/auth/forgot-password$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/reset-password$, roles: PUBLIC_ACCESS }

        # Authentification des opérations destructrices.
        - { path: ^/api/auth/logout$, roles: IS_AUTHENTICATED_FULLY }

        # Tout le reste de l'API est réservé aux comptes authentifiés.
        # Le rôle métier (PATRON, ADMIN_IMMOBILIER, ADMIN_VILLE) n'est pas
        # fixé ici : il dépend de l'Organization visée et relève de
        # `SecurityService`, qui seul connaît ce contexte.
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
