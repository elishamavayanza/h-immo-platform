nelmio_api_doc:
    documentation:
        info:
            title: 'H-Immo API'
            description: >
                API REST pour la gestion immobilière.

                L'authentification est **sans état** : `POST /api/auth/login`
                renvoie un jeton `JWT` (HS256) dans le corps de la réponse,
                et chaque requête ultérieure le transmet dans l'en-tête
                `Authorization: Bearer <token>`. Aucun cookie n'est émis et
                aucune session n'est créée côté serveur.

                Le jeton est auto-porteur : il contient l'identifiant du
                compte et ses droits, pour que le client puisse construire
                son état sans appel réseau supplémentaire. Deux règles en
                découlent :

                - la durée de vie est courte (1 h par défaut) et le
                  changement d'un droit ne s'applique qu'aux jetons émis
                  ensuite ;
                - le compte est néanmoins rechargé en base à chaque
                  requête, donc la désactivation d'un compte prend effet
                  immédiatement, sans attendre l'expiration.

                `POST /api/auth/logout` révoque le jeton présenté : il
                devient inutilisable même s'il a été intercepté.
            version: '1.0.0'
        components:
            securitySchemes:
                # Le schéma `bearer` décrit ici le mécanisme réellement
                # en place : le bouton « Authorize » de Swagger UI saisit
                # le jeton et l'envoie dans l'en-tête `Authorization`.
                bearer:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
                    description: >
                        Jeton renvoyé par `POST /api/auth/login` dans le
                        champ `accessToken`.
        security:
            - bearer: []
        models:
            names:
                - type: 'App\Dto\Feedback'
                  alias: 'Feedback'
                - type: 'App\Dto\Request\Auth\ForgotPasswordRequest'
                  alias: 'ForgotPasswordRequest'
                - type: 'App\Dto\Request\Auth\ResetPasswordRequest'
                  alias: 'ResetPasswordRequest'
            use_jms: false
    areas: # to filter documented areas
        path_patterns:
            - ^/api(?!/doc$) # Accepts routes under /api except /api/doc
