# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # La session n'est démarrée que si le code la lit ou l'écrit.
    session:
        # `save_path` est fixé explicitement. Laissé vide, Symfony n'applique
        # rien et PHP écrit dans son réglage système — `/var/lib/php/sessions`
        # sur une Debian — qui peut être absent ou non inscriptible en
        # conteneur. Le fichier de session disparaît alors sans erreur visible
        # et la requête suivant un login réussi est refusée en 401.
        handler_id: session.handler.native_file
        save_path: '%kernel.project_dir%/var/sessions/%kernel.environment%'
        name: HIMMOMPA
        cookie_httponly: true
        cookie_samesite: lax
        cookie_secure: auto
        cookie_lifetime: 86400

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
