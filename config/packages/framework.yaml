# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # L'API est désormais sans état : le pare-feu `main` est `stateless`
    # et l'authentification se fait par jeton Bearer. Aucune session PHP
    # n'est donc créée, et le cookie `HIMMOMPA` ci-dessous n'est plus émis.
    #
    # Ce bloc est conservé pour deux raisons : il reste la configuration
    # de repli si une authentication par session est réintroduite, et
    # `save_path` évite que PHP n'écrive dans `/var/lib/php/sessions`,
    # absent ou non inscriptible en conteneur.
    session:
        # `save_path` est fixé explicitement. Laissé vide, Symfony n'applique
        # rien et PHP écrit dans son réglage système — `/var/lib/php/sessions`
        # sur une Debian — qui peut être absent ou non inscriptible en
        # conteneur. Le fichier de session disparaît alors sans erreur visible
        # et la requête suivant un login réussi est refusée en 401.
        handler_id: session.handler.native_file
        save_path: '%kernel.project_dir%/var/sessions/%kernel.environment%'
        name: HIMMOMPA
        cookie_httponly: true
        cookie_samesite: lax
        cookie_secure: auto
        cookie_lifetime: 86400

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
