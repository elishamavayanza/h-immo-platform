
services:
###> doctrine/doctrine-bundle ###
  # Aucun bloc `ports` ici : `compose.yaml` publie déjà 3306:3306, ce qui
  # correspond à `DATABASE_URL`. Ce fichier exposait 5432, le port de
  # PostgreSQL, sur un hôte au hasard — donc ni la version MariaDB, ni
  # une adresse stable pour l'API.
###< doctrine/doctrine-bundle ###

###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###
